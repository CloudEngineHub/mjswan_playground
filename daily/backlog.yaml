# The daily routine's queue (ROUTINE.md, part D), first entry first. Its scout (part A)
# adds entries, orders them by popularity plus ease and removes the ones that already have
# a task, through the `claude/daily-backlog` pull request. An entry is one repository, to be
# ported with every simulation in it that mjswan can run.
#
#   id           playground id
#   repo         upstream repository
#   commit       the commit the entry was reviewed at
#   simulations  each mjlab task or experiment with a trained policy of its own: `task`,
#                `policy` (where the checkpoint is) and `ease`
#   left_out     upstream's other simulations, each with why it is not ported
#   license      everything the build fetches: code, checkpoints, clips, robot assets
#   popularity   0 to 3, with the stars and posts it rests on (ROUTINE.md, part A)
#   ease         0 to 3: its simulations' lowest above 0; 0 is a stop for an unattended run
#   notes        what the port is known to need
#   found        for an entry the scout added: when, and the evidence
#   pinned       a person's reason to port it first; kept on top in the order they set
#
# An entry with a single `task` and `policy` still waits for part A to list its
# repository's simulations.

- id: wuji
  pinned: '2026-10-11: the owner asked for it first, with the plan in notes'
  repo: https://github.com/wuji-technology/wuji-mjlab
  commit: 26b99c6338641e8edc17caf87922e6e1767121fa
  simulations:
    - task: WujiHand_Reorient (src/wuji_mjlab/tasks/reorient/config/wuji_hand), Wuji Hand 1 turning a cube
      policy: release v2026.9.27 asset wuji-mjlab-v2026.9.27-assets.zip (sha256 de01b29921b69ea38100a29416c324b384905e1ae4ebbfa40d769be948fc2d39), reorient/checkpoints/hand1/policy.onnx (obs 207, actions 20); joint order and default pose in its config.json
      ease: '1: no change to mjswan under the plan in notes, but several rewrites and two approximations no run has checked yet'
    - task: WujiHand2_Reorient or WujiHand2_Reorient_50Hz (src/wuji_mjlab/tasks/reorient/config/wuji_hand2), Wuji Hand 2 turning a cube; its checkpoint's config.json says which
      policy: the same bundle, reorient/checkpoints/ for Hand 2
      ease: '1: the same action term and plan as Hand 1; the 50 Hz recipe sets ema_alpha 0.3'
    - task: WujiHand2_PenSpin (src/wuji_mjlab/tasks/pen_spin), Wuji Hand 2 spinning a pen, five policy groups
      policy: the same bundle, pen_spin/checkpoints/<group>/policy.onnx for 01_single_axis, 02_continuous_single_axis, 03_continuous_multi_axis, 04_stable_grasp_rotation and 05_multi_axis_two_rotations, each with its reference trajectories (pen_spin/data/rawdata/clips, 40 in all)
      ease: '0: SingleHandResidualEMAActionCfg smooths only the policy''s residual and adds it to a reference trajectory the command owns, so an actuator filter would smooth the reference too; it needs action state mjswan does not model'
  left_out: >-
    Of the two Hand 2 reorient tasks, the one the bundle's Hand 2 checkpoint was not trained
    on.
  license: Apache-2.0 for the code and checkpoints (the bundle's NOTICE); the hand meshes are MIT (wuji-technology/wuji-description)
  popularity: '2: 251 stars (2026-10-10); X post on its release (2026-06-02); shown at ICRA'
  ease: '1: both reorient simulations, under the plan in notes; pen spin is at 0'
  notes: >-
    Wuji Hand 1 and Hand 2 turning a cube to commanded orientations, and Hand 2 spinning a
    pen. The plan for both reorient simulations, agreed with the owner on 2026-10-11, needs
    no change to mjswan. (1) Replace JointPositionOffsetEMAActionCfg with mjlab's
    JointPositionActionCfg (scale 0.5, use_default_offset, and a clip per joint to
    [max(soft lower, default - 0.5), min(soft upper, default + 0.5)], which is wuji's two
    clamps in one), and move the EMA into the XML's <position> actuators: dyntype
    filterexact, dynprm[0] = -dt / ln(1 - ema_alpha) with dt the control step (Hand 1:
    0.05 s and 0.5, so 0.0721 s), and the keyframe's act at the default pose, through an
    EntityCfg subclass as duet's _HeldArmsCfg edits actuators. The filter equals the EMA
    at the end of every control step and moves smoothly within one, about half a step
    later. (2) previous_raw_action is last_action with history_steps, as in jumper.
    (3) joint_pos_target_error reads the filter state, env.sim.data.act, in place of
    processed_action, rewritten in terms.py; check that the browser serves act. (4) The
    0.4 s warmup that holds the default pose has no clean route: drop it first, and if
    the preview fails right after a reset, gate the policy with an ONNX wrapper that
    outputs 0 for the warmup's control steps, from an observation reading
    episode_length_buf. (5) The goal command draws with torch.rand and needs a command
    binding; cage_drop reads a reward's counter and never fires in a browser, so drop it
    and say so. Parity cannot check the action side: compare the preview with an mjlab
    rollout of the same checkpoint. If the plan does not hold up, skip wuji with a
    daily-task-skipped issue naming what failed; the owner accepts that.
    ttktjmt/mjswan#110 tried the mjswan route and was closed unmerged. The bundle's
    NOTICE names training commits that are not public; the public config matches the
    checkpoint's config.json.
  found: '2026-10-07: 244 stars, X post on its release, ICRA demo'

