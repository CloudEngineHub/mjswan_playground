  commit: ed4ee6c581af9a7effcb53ee219d10784a839ca3
  simulations:
    - task: Vibe-Dodge-ConeFast-ImgFeat-Ext (src/vibe/tasks/dodge/config/g1), dodging balls thrown in a room
      policy: Hugging Face lkrajan/vibe at b599ddb4478411fa3456a7cd21cd9f0d4951991d (tag v0.1.0), Vibe-Dodge-ConeFast-ImgFeat-Ext/checkpoint.pt (model_14999; .pt only, upstream's export-agent writes ONNX; sha256 in src/vibe/release.json)
      ease: '0: reads frozen Theia-tiny features of a rendered head-camera RGB image, which mjswan does not render (pacman dropped its rendering camera for that reason), through an adapter on a frozen SONIC base tied to Mocke''s obs, action and motion-command contract; no ONNX upstream'
    - task: Vibe-PerLoco-Grail-ImgFeat-Ext (src/vibe/tasks/perloco/config/g1), perceptive locomotion over GRAIL curbs
      policy: the same revision, Vibe-PerLoco-Grail-ImgFeat-Ext/checkpoint.pt (model_14999)
      ease: '0: as Dodge'
    - task: Vibe-PerLoco-OmRe-ImgFeat-Ext, perceptive locomotion over OmniRetarget climbs
      policy: the same revision, Vibe-PerLoco-OmRe-ImgFeat-Ext/checkpoint.pt (model_14999)
      ease: '0: as Dodge'
    - task: Vibe-Repose-BigCubeFloor-ImgFeat-Ext (src/vibe/tasks/repose/config/g1), turning a 0.61 m cube on the floor until the commanded colour faces up
      policy: the same revision, Vibe-Repose-BigCubeFloor-ImgFeat-Ext/checkpoint.pt (model_59999)
      ease: '0: as Dodge'
    - task: Vibe-Uolm-ImgFeat-Ext (src/vibe/tasks/uolm/config/g1), loco-manipulation over a six-object roster
      policy: the same revision, Vibe-Uolm-ImgFeat-Ext/checkpoint.pt (model_24999)
      ease: '0: as Dodge'
  left_out: >-
    Seven registered tasks ship no checkpoint: Vibe-Repose-BigCubeFloor-ObjKin, -ImgFeat,
    -ImgFeat-Sfd, -ImgFeat-Lfd and -ImgRgb, Vibe-Repose-SmallCubeTable-ImgFeat-Ext and
    Vibe-Dodge-ImgFeat-Ext. The Orcs-* and Mocke-* tasks are the dependencies' own, and
    their privileged AdaptSonic twins have no released checkpoints.
  license: BSD-3-Clause for the code; NVIDIA Open Model License for the checkpoints (they adapt a frozen SONIC base); OmniRetarget clips MIT, GRAIL under NVIDIA terms; the Theia-tiny encoder under its own model card
  popularity: '1: 59 stars (2026-10-14); arXiv 2609.09918 with a project page and live demo'
  ease: '0: every released policy needs the camera, the encoder and the SONIC base'
  notes: >-
    G1 perceptive whole-body control: dodging, cube reorientation, terrain locomotion and
    loco-manipulation. Pins mjlab==1.4.0 with git dependencies orcs, mocke and an rsl_rl
    fork (deps.lock), and its clips from Hugging Face dataset l-k-r/retargeted_motions;
    actions are mjlab's JointPositionActionCfg through Mocke's SONIC profile. The browser
    would need camera rendering, the Theia encoder and the SONIC motion command. Upstream's
    pyproject also warns that mjlab 1.6 renders the skybox into sensor cameras, which moves
    the head camera's images away from the ones every checkpoint trained on.
  found: '2026-10-09: GitHub mjlab topic (recently updated), 54 stars'

- id: badminton
  repo: https://github.com/WATonomous/pioneer_humanoid
  commit: b335b59b5c5ae8c2f3c8da03c1f01c85232b5b2c
  simulations:
    - task: Mjlab-Badminton-Receive-Student-PPO (src/simulation/badminton/humanoid_badminton), the team's stationary 6-DoF arm returning badminton serves from a launcher bank on EKF-tracked shuttle perception
      policy: 'models/badminton_student_ppo/model_4997.pt in git (61 inputs, 6 joint-position targets; convert at build time): 98.8 % bank hits and 78 % net clearance per models/README.md, which calls it the deployable one'
      ease: '0: BadmintonActionCfg, defined in the repository (humanoid_badminton/shuttle_action.py), applies the shuttle''s quadratic drag and cork-first orientation every physics substep and rate-limits and low-passes the arm targets, which no mjswan action does; on top, 1 kHz physics (timestep 1 ms, decimation 20) and PerceptionCommandCfg''s EKF'
    - task: Mjlab-Badminton-Receive-Teacher, the privileged-state teacher (true shuttle state, trajectory prior and intercept target)
      policy: models/badminton_teacher/model_5996.pt in git (98.5 % bank hits)
      ease: '0: the same action term'
  left_out: >-
    Mjlab-Badminton-Receive-Student, the distilled student: no checkpoint of its own (its PPO
    fine-tune is the student above). The other baselines in models/ (push, push_distill,
    pioneer_hand_cube, pioneer_humanoid_flat and pioneer_humanoid_rough) are Isaac Lab tasks
    (Isaac-*-v0), not mjlab ones.
  license: 'Apache-2.0 (LICENSE) for the code and the checkpoints; the arm URDF (assets/pioneer_bimanual_arm) carries no separate notice'
  popularity: '0: 40 stars and 10 forks (2026-10-14)'
  ease: '0: both policies need the repository''s own action term, which carries the shuttle''s aerodynamics'
  notes: >-
    The University of Waterloo WATonomous team's Pioneer humanoid; its mjlab part is the arm
    receiving serves, on mjlab==1.6.0, mjswan's version (Python 3.12; humanoid_badminton
    imports aero, launcher and perception_torch from its parent directory). The shuttle's
    drag and orientation sit in the action term because ActionTerm.apply_actions is mjlab's
    per-substep hook; a port needs mjswan to apply them, perhaps through MuJoCo's own fluid
    model for the drag (unverified). XmlActuatorCfg runs the XML's actuators, and each
    episode launches a serve from scene/params.yaml's bank (reset_badminton_episode). A stop
    for an unattended run.
  found: '2026-10-13: GitHub search for mjlab in READMEs (recently pushed), 40 stars'

