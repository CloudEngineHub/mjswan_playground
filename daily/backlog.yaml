- id: wuji
  repo: https://github.com/wuji-technology/wuji-mjlab
  commit: 26b99c6338641e8edc17caf87922e6e1767121fa
  task: WujiHand_Reorient
  policy: release v2026.9.27 asset wuji-mjlab-v2026.9.27-assets.zip (sha256 de01b29921b69ea38100a29416c324b384905e1ae4ebbfa40d769be948fc2d39), reorient/checkpoints/hand1/policy.onnx (obs 207, actions 20); joint order and default pose in its config.json
  license: Apache-2.0 for the code and checkpoints (the bundle's NOTICE); the hand meshes are MIT (wuji-technology/wuji-description)
  popularity: '2: 244 stars (2026-10-07); X post on its release (2026-06-02); shown at ICRA'
  ease: '0: JointPositionOffsetEMAActionCfg, defined in the repository, smooths its target with an EMA and holds a 0.4 s warmup, which no mjswan action does'
  notes: >-
    A 20-joint Wuji hand turning a cube to commanded orientations. Besides the action
