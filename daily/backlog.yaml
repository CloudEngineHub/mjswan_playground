  notes: >-
    Yu et al., RSS 2026: Fisher-information-weighted exploration for model-based policy
    optimization. Pretrain is PPO on the mjlab env (4,096 envs, 24 steps per iteration,
    imagination and information gain off) under QOED's dynamics randomization on reset,
    fitting a transformer shortcut dynamics model alongside; the README plays those
    checkpoints as they are (mbpo/rsl_rl/play.py --mode pretrain, on a pure-MuJoCo backend
