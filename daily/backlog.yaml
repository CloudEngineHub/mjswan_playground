    ponytail stub for rsl_rl.runners.MBPOOnPolicyRunner, which mbpo/rsl_rl/mbpo_tasks.py
    imports at module top (it also imports PIL, which the playground has). rsl-rl 5.4.2's
    runner loads only actor_state_dict, and mjswan's export_checkpoint builds the task's own
    runner (here QOED's MbpoRunner), so upstream.py converts each checkpoint itself:
    model_state_dict's actor.0 to actor.6 onto a 512/256/128 ELU MLP (Identity normalizer,
    nothing to bake), exported with mjlab's metadata from the env (get_base_metadata), which
    the .pt lacks. The play configs keep five MBPO-only observation groups (policy,
    system_state, system_action, system_contact, system_termination) that mjswan would keep
    as author slots: pass env_cfg.observations["actor"] alone. The legged runs never reached
    the command curriculum's second stage (step 120,000, against 24,000 and 96,000 steps), so
    they know vx and vy within 1 m/s and yaw within 0.5 rad/s; mjlab's flat play configs widen
    vx to (-1.5, 2.0) and yaw to 0.7 rad/s: keep the training ranges. The rough floor is
    QOED's, not mjlab's generator: a scene spec_fn turns the plane into a 40 m square
    heightfield (hfield.png mirrored 2x2, 5 cm relief, rocky texture), and a 35-ray scan
    (1.2 by 0.8 m at 0.2 m, yaw-aligned, 2 m range) from the trunk, pelvis or base_link joins
