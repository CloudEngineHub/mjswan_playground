  license: Apache-2.0 for the code and checkpoints (the bundle's NOTICE); the hand meshes are MIT (wuji-technology/wuji-description)
  popularity: '2: 251 stars (2026-10-11); X post on its release (2026-06-02); shown at ICRA'
  ease: '1: both reorient simulations, under the plan in notes; pen spin is at 0'
  notes: >-
    Wuji Hand 1 and Hand 2 turning a cube to commanded orientations, and Hand 2 spinning a
    pen. The plan for both reorient simulations, agreed with the owner on 2026-10-11, needs
    no change to mjswan. (1) Replace JointPositionOffsetEMAActionCfg with mjlab's
    JointPositionActionCfg (scale 0.5, use_default_offset, and a clip per joint to
    [max(soft lower, default - 0.5), min(soft upper, default + 0.5)], which is wuji's two
    clamps in one), and move the EMA into the XML's <position> actuators: dyntype
    filterexact, dynprm[0] = -dt / ln(1 - ema_alpha) with dt the control step (Hand 1:
    0.05 s and 0.5, so 0.0721 s), and the keyframe's act at the default pose, through an
    EntityCfg subclass as duet's _HeldArmsCfg edits actuators. The filter equals the EMA
    at the end of every control step and moves smoothly within one, about half a step
    later. (2) previous_raw_action is last_action with history_steps, as in jumper.
    (3) joint_pos_target_error reads the filter state, env.sim.data.act, in place of
    processed_action, rewritten in terms.py; check that the browser serves act. (4) The
    0.4 s warmup that holds the default pose has no clean route: drop it first, and if
    the preview fails right after a reset, gate the policy with an ONNX wrapper that
    outputs 0 for the warmup's control steps, from an observation reading
    episode_length_buf. (5) The goal command draws with torch.rand and needs a command
    binding; cage_drop reads a reward's counter and never fires in a browser, so drop it
    and say so. Parity cannot check the action side: compare the preview with an mjlab
    rollout of the same checkpoint. If the plan does not hold up, skip wuji with a
    daily-task-skipped issue naming what failed; the owner accepts that.
    ttktjmt/mjswan#110 tried the mjswan route and was closed unmerged. The bundle's
    NOTICE names training commits that are not public; the public config matches the
    checkpoint's config.json.
  found: '2026-10-07: 244 stars, X post on its release, ICRA demo'

- id: amp
  repo: https://github.com/ccrpRepo/AMP_mjlab
  commit: 6c7a2947fccc973e4af8e6d90e550400f1b6fcfc
  simulations:
    - task: Unitree-G1-AMP-Flat (src/tasks/amp_loco/config/g1), one G1 policy that walks, runs and gets back up after a fall
      policy: 'ccrpRepo/wbc_fsm at b352409d73bed469169334040ee9ea70bc28a5f1, model/loco/Unitree-G1-AMP-Flat_model_30000.onnx (obs 384 = 4 frames of 96, time-major; actions 29; no mjlab metadata); the deployed contract is that repo''s config/mjamp.json and include/FSM/State_MJAmp.h (history 4, joint map, KNEES_BENT default pose, action scale 0.25 effort/kp)'
      ease: '2: several playground-side rewrites: the time-major history recast as per-lag terms, the motion-reset events dropped, the registration bypassed, UnitreeActuatorCfg run as its BuiltinPositionActuatorCfg base, mjlab 1.2.0 shims'
  left_out: >-
    Unitree-G1-AMP-Rough, Unitree-G1-Rough and Unitree-G1-Flat: no checkpoint of their own.
    wbc_fsm's other ONNX files (amp_0309_1, loco_0731 with an LSTM, dance12_0207_1) are torch
    2.5.1, opset-11 exports for the deploy repo's other controllers, with no task in this
    repository.
  license: 'none stated: neither AMP_mjlab nor wbc_fsm has a LICENSE file, so all rights are reserved and publishing is the author''s call; the G1 MJCF and meshes are Unitree''s (BSD-3-Clause, as in unitreerl); the AMP clips under src/assets/motions only train and are not shipped'
  popularity: '2: 472 stars (2026-10-11); a CSDN write-up of the method'
  ease: '2: one simulation, no change to mjswan, several playground-side rewrites (time-major history, motion-reset events dropped, registration bypassed, Unitree actuators run as their base) and mjlab 1.2.0 shims'
  notes: >-
    A Unitree G1 that walks, runs and gets up after falls with one AMP policy. Checkout
    shape: upstream imports itself as the top-level `src`, like unitreerl. Pins
    mjlab==1.2.0: shim update_assets and CollisionCfg as unitreerl does. The actor group sets
    history_ordering="time", a field only the repo's mjlab_patch adds and mjlab 1.6.0
    rejects: shim the field, and rebuild the 384-wide input as the six terms (base_ang_vel
    from imu_ang_vel, projected_gravity, the twist command, joint_pos_rel, joint_vel_rel,
    last_action) at look-backs 3, 2, 1 and 0, oldest frame first and term order within a
    frame, which is the deploy code's buffer. Drop the critic and amp groups and the
    init_motion_loader and reset_from_motion_data events, which reset into recovery clips
    (play sets delay_reset_env_ratio 1.0). Registration imports AMPOnPolicyRunner from the
    vendored rsl_rl fork at the repo root, and wandb: build g1_amp_flat_env_cfg(play=True)
    directly. The UnitreeActuatorCfg_* classes subclass BuiltinPositionActuatorCfg and clip
    effort to a torque-speed curve with Fs/Fd friction in torch; mjswan runs the <position>
    actuators, dropping both. No metadata: the joint order and default pose come from
    State_MJAmp.h, whose pose is the config's KNEES_BENT_KEYFRAME. mjlab's own
    UniformVelocityCommandCfg and JointPositionActionCfg; 200 Hz physics, 50 Hz control.
    The flat actor group at HEAD equals 2d6b0d1's (2026-04-29), the policy's era. pacman
    already runs a Unitree-G1-AMP-Flat scene from a repository that ships the same AMP
    clips, with its own checkpoint; LainLab ships this ONNX byte for byte.
  found: '2026-10-11: GitHub search for mjlab (stars), 472 stars'

- id: ufo
  repo: https://github.com/Roboparty/UFO
  commit: 0b89378de02f77712072d983bc43ec2a46455dc0
  simulations:
    - task: the G1 forward-backward (FB) policy in HumanoidVerse's mjlab backend (make_mjlab_ufo_env_cfg in humanoidverse/agents/envs/humanoidverse_mjlab.py, built from Hydra configs, not registered with mjlab), prompted with a latent z
      policy: 'Hugging Face xuewang/ufo-g1-policy at fc5efb7b3bb7a82270abaeabb0cf3c1194f1c7e6, g1_policy/exported/FBcprAuxModel.onnx (actor_obs [1, 721] = 465 proprioception + 256 z; actions 29; 128.5 MB) with the z contexts tracking_inference_mjlab/zs_{3,6,7,8,15,20,24,25,39}.pkl, reward_inference_mjlab/reward_locomotion.pkl and goal_inference_mjlab/goal_reaching.pkl'
      ease: '1: the model card states no license, on top of several rewrites (the 721-wide observation rebuilt as terms, z fed as a command, a 128.5 MB ONNX)'
  left_out: >-
    The TeCH agent and robots other than the G1 (the robot-config path): no released
    checkpoint. The deploy branch's PICO teleoperation, which streams z from a live
    retargeter.
  license: 'CC BY-NC 4.0 for UFO (LICENSE); the Hub model card states none; the G1 MJCF is Unitree''s (BSD-3-Clause); the LAFAN1-derived training data (xuewang/UFO-MotionData) is not needed at play'
  popularity: '2: 307 stars (2026-10-11); press on RoboParty''s RP1 humanoid at IROS 2026 names UFO in its control stack'
  ease: '1: one simulation whose Hub checkpoint states no license, with its observation rebuilt as terms, z fed as a command and a 128.5 MB ONNX to shrink'
  notes: >-
    An unsupervised behavior-foundation policy for the G1: one network that tracks a motion,
    walks or reaches a goal depending on the latent z it is given. The mjlab env config is a
    physics shell whose actor group holds a placeholder joint_pos term; HumanoidVerse
    computes the policy's input outside mjlab's managers. Rebuild it from the deploy branch
    (eb556f9173ec1c7519f643211409140f8b2690c8) rl_policy/observations/ufo_policy.py and
    config/policy/g1_policy.yaml: dof_pos minus default, dof_vel, projected_gravity,
    base_ang_vel x0.25 and prev_actions, then 4-step histories of the same terms in the
    yaml's order, newest first (history_steps offsets), then z. Feed z per control step from a table for a tracking
    context (a command binding), or hold one z for the reward and goal contexts; the
    contexts are pickles, so convert them at build time. DcMotorActuatorCfg runs as PD
    within its effort limit, dropping the DC torque-speed curve; JointPositionActionCfg
    with per-joint scales and preserve_order. 200 Hz physics, decimation 4. Pins
    mjlab==1.4.0 and mujoco~=3.8.0: checkout shape. The 128.5 MB ONNX is over mjswan
    Cloud's 100 MB per upload: convert it to float16.
  found: '2026-10-11: GitHub mjlab topic (stars), 307 stars'

