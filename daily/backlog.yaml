# The daily routine's queue (ROUTINE.md, part D), first entry first. Its scout (part A)
# adds entries and orders them by popularity plus ease through the `claude/daily-backlog`
# pull request.
#
#   id          playground id
#   repo        upstream repository
#   commit      the commit the entry was reviewed at
#   task        the mjlab task to port
#   policy      where the checkpoint is
#   license     everything the build fetches: code, checkpoint, clips, robot assets
#   popularity  0 to 3, with the stars and posts it rests on (ROUTINE.md, part A)
#   ease        0 to 3, with what the port needs; 0 is a stop for an unattended run
#   notes       what the port is known to need
#   found       for an entry the scout added: when, and the evidence

- id: jumper
  repo: https://github.com/KingKongRobotics/jumper
  commit: 61d065219fca767f3142c8f10aff59eae5a5a004
  task: 'jumper.posture (upstream''s own registry id; the port registers it with mjlab)'
  policy: tasks/jumper/posture/out/example/actor.onnx (obs 415, actions 20); deploy contract in layout.json beside it, and model_74800.pt
  license: Apache-2.0 for the code, robot assets and checkpoints (LICENSE, NOTICE); the copies vendored under rl/ carry their own (mjlab Apache-2.0, rsl_rl BSD-3-Clause), and NOTICE names the third-party files
  popularity: '3: 1361 stars (2026-10-07) nine days after it was created; trendshift; posts on X'
  ease: '2: no mjswan change; its own registry, a strided history, a gait clock and a posture command to rewrite; physics at 1 kHz and control at 200 Hz'
  notes: >-
    A 22-joint crab robot holding a commanded twist, pitch, roll and body height. Upstream
    registers through its own tasks.registry, not mjlab's: upstream.py builds
    tasks.jumper.posture.env_cfg.env_cfg(play=True) and registers it with
    register_mjlab_task. It runs on PyPI mjlab 1.6.0: the vendored copy only adds a
    physics-backend seam and an rsl_rl field that its rl_cfg sets, so build the runner
    config for resolve_runner_defaults by hand. ServoCurveActuatorCfg subclasses
    IdealPdActuatorCfg, so mjswan runs it as PD within the 1.746 N*m plateau; list the
    torque decay above 30.7 rad/s and the thermal derating to 1.2 N*m as dropped, with
    the highest joint speed the parity env reaches. StridedHistory (5 frames, stride 4)
    becomes per-term history_steps (16, 12, 8, 4, 0); VariableGaitClock and
    PostureCommandCfg (uniform_ draws, episode_length_buf reads) need rewrites as command
    terms, with sliders for the posture. The claws, LF_J4 and RF_J4, are unactuated and
    stay at 0 (layout.json). The preview's real-time check decides whether the browser
    keeps up.
  found: '2026-10-07: created 2026-09-28; 1361 stars, trendshift, posts on X'

