# The daily routine's queue (ROUTINE.md, part D), first entry first. Its scout (part A)
# adds trending entries at the top through the `claude/daily-backlog` pull request.
#
#   id       playground id
#   repo     upstream repository
#   commit   the commit the entry was reviewed at
#   task     the mjlab task to port
#   policy   where the checkpoint is
#   license  everything the build fetches: code, checkpoint, clips, robot assets
#   notes    what the port is known to need
#   found    for an entry the scout added: when, and the evidence it was trending

- id: bipedhrl
  repo: https://github.com/spaethli/biped_hrl
  commit: cd2c75a1f12a78fe5aeb49f78c94ba3faf3116d7
  task: Unitree-H1_2-Flat
  policy: deploy/robots/h1_2/config/policy/velocity/v0/exported/policy.onnx (obs 92, actions 27); deploy contract in deploy/robots/h1_2/config/policy/velocity/v0/params/deploy.yaml
  license: Apache-2.0; the H1-2 MJCF and meshes carry no license file of their own
  notes: >-
    Unitree H1-2 walking to velocity commands, with the checkpoint the author ran on the
    robot. Runs from source as top-level `src` (pacman's checkout shape); importing
    src.tasks registers it. Its `phase` observation reads env.episode_length_buf, which
    the tracer refuses: rewrite it the way husky does. The tree holds several ONNX files;
    use the one above.

- id: upkie
  repo: https://github.com/MarcDcls/mjlab_upkie
  commit: d7895789a601943f78b3b9bcdc4def7b444f9913
  task: Mjlab-Velocity-Upkie
  policy: logs/rsl_rl/upkie_velocity/bests/default.onnx (obs 22, actions 6)
  license: Apache-2.0
  notes: >-
    Upkie, a wheeled biped, balancing and driving to velocity commands. Pins
    mjlab==1.3.0, so the checkout shape and a 1.3 to 1.6 diff. The wheels use mjlab's
    JointVelocityActionCfg, which mjswan 0.11.1 does not support: a generic gap, so
    expect step 9 and a needs-mjswan draft.

- id: duet
  repo: https://github.com/bae-air-lab/DUET
  commit: 439c21bd2817feedd519475e8301195b95cb6fcb
  task: Unitree-G1-23Dof-Duet-Flat
  policy: exported/policy.onnx (obs 71, actions 13); contract in exported/deploy_contract.json
  license: Apache-2.0; the G1 meshes carry no license file of their own
  notes: >-
    A G1 walking and squatting on a height command down to 0.18 m pelvis height. Top-level
    `src`, mjlab==1.2.0: checkout shape. BaseHeightCommandCfg needs a command binding; the
    passive UpperBodyPoseActionCfg is dropped, so the arms stay still; `phase` needs the
    husky rewrite; mjlab.utils.os.update_assets is gone in 1.6.0 and needs a shim.

- id: tasknpoint
  repo: https://github.com/wernerb43/tasknpoint
  commit: b8faaf284e0cef8021b94e2219492dbd54efba0c
  task: Mjlab-MultiTarget-Tracking-Flat-Unitree-G1
  policy: deploy/policies/kicks_no_ori.onnx (inputs obs 157, which_motion, time_step; five clips baked in)
  license: MIT; the clips were retargeted from video with PromptHMR and GMR, source videos not stated
  notes: >-
    A G1 kicking a commanded target point with one of five kicks. The task lives in the
    tasknpoint_project sub-project, which wants Python 3.13: checkout shape.
    MultiTargetMotionCommandCfg is task-specific and needs a command binding, and the
    extra which_motion input needs its own in_keys and five clip rebuilds.

- id: homierl
  repo: https://github.com/Nagi-ovo/mjlab-homierl
  commit: 14f88418aa3d2ae046da4b14dae8135cebff6b05
  task: Mjlab-Homie-Unitree-H1
  policy: Hugging Face Nagi-ovo/HOMIERL-loco, policy.onnx (unverified; pin a revision)
  license: Apache-2.0; reproduces OpenHomie (CC BY-NC-SA 4.0) and reuses its values; the Hub model's license is unverified
  notes: >-
    An H1 walking and squatting to a commanded height while its upper body is disturbed.
    Which task the Hub checkpoint belongs to is unverified. Pins mjlab<1.6.0: checkout
    shape. DelayedJointPositionActionCfg has a zero delay in play and can become mjlab's
    JointPositionActionCfg; the passive UpperBodyPoseActionCfg is dropped;
    RelativeHeightCommandCfg needs a command binding.

- id: inhand
  repo: https://github.com/Msornerrrr/in-hand-rotation-mjlab
  commit: 14004fe3bd5ee2ed51d8b7348ca5da34338c7f1e
  task: Mjlab-Leap-Left-Custom-HandCube-Rotate
  policy: ckpts/leap_left_custom_model_4900.pt (convert at build time)
  license: Apache-2.0; the LEAP hand MJCF is MIT
  notes: >-
    A LEAP hand spinning a cube in its palm. Written for mjlab 1.1 (DelayedActuatorCfg,
    TerrainImporterCfg and update_assets are gone in 1.6.0). Its JointPositionDeltaActionCfg
    is task-specific and stateful, so expect the data-only stop unless mjswan gains a
    delta action; branch claude/in-hand-rotation-feasibility-vcnq4g of this repo has a
    feasibility study.

- id: luwu
  repo: https://github.com/LuwuDynamics/luwu_mjlab
  commit: 447945fd40fb5585271dce4ea8cc82567916032a
  task: Mini2S-Walk-Flat
  policy: none upstream; Hugging Face robomotic/XGO is a third party's (unverified)
  license: Apache-2.0 for code and robot models; the third-party checkpoint's license is unverified
  notes: >-
    The XGO Mini2S, a palm-sized robot dog, walking to velocity commands. mjlab==1.2.0:
    XmlPositionActuatorCfg, XmlMotorActuatorCfg, DelayedActuatorCfg and update_assets need
    shims, and `phase` needs the husky rewrite. A stop until someone checks the
    checkpoint's license.
