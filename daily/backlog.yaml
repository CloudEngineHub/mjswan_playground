    closed unmerged. The goal command draws with torch.rand and needs a binding; cage_drop
    reads a reward's counter and never fires in a browser. The bundle's NOTICE names
    training commits that are not public; the public config matches the checkpoint's
    config.json.
  found: '2026-10-07: 244 stars, X post on its release, ICRA demo'

