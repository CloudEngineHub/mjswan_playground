    published for them, and they trained briefly against mjlab's own budgets (Go1 1,000 of
    mjlab's 10,000 iterations, G1 4,000 of 30,000): whether each walks or spins the cube
    waits for filming. QOED forces rsl-rl-lib to leggedrobotics/rsl_rl_rwm (rsl-rl-lib 3.1.0
