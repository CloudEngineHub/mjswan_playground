name: deploy

# Every task in one mjswan app (msp site), published to GitHub Pages from main. A pull
# request builds and loads the same site without publishing it.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "scripts/check_site.py"
      - ".github/workflows/deploy.yml"
  # No paths filter: `ready` is a required check, so it has to report on every PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
      tasks: ${{ steps.tasks.outputs.tasks }}
    steps:
      - uses: actions/checkout@v5

      - name: Did anything the site reads change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo build=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=${{ github.event.pull_request.base.sha }}
          git fetch -q --depth 1 origin "$base"
          if git diff --name-only "$base" HEAD | grep -qE \
              '^(src/|pyproject\.toml$|uv\.lock$|README\.md$|scripts/check_site\.py$|\.github/workflows/deploy\.yml$)'; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo build=false >> "$GITHUB_OUTPUT"
          fi

      # README's order, less the tasks _site.NOT_ON_SITE leaves out. Nothing heavy is
      # imported, so the runner's own Python reads them.
      - name: Task ids
        id: tasks
        run: |
          tasks=$(PYTHONPATH=src python3 -c 'import json; from mjswan_playground._site import task_order; print(json.dumps(task_order()))')
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

  # A runner per task: pacman and bipedhrl both import their upstream as a top-level `src`.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pinned upstream checkouts, Hub downloads and conversions: a run reaches GitHub
      # and the Hub for them only when the task's sources or the lock change.
      - uses: actions/cache@v6
        with:
          path: |
            .cache
            ~/.cache/huggingface
          key: upstream-${{ matrix.task }}-${{ hashFiles(format('src/mjswan_playground/{0}/**', matrix.task), 'src/mjswan_playground/_deps.py', 'uv.lock') }}

      - run: uv sync --frozen --all-extras

      - run: uv run --frozen msp build ${{ matrix.task }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}
          path: dist/${{ matrix.task }}
          if-no-files-found: error
          retention-days: 1

  site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen --group previews

      # Each build lands in dist/<task-id>.
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Merge every task into one app
        run: uv run --frozen msp site --no-build --base-path "/${{ github.event.repository.name }}/"

      - name: Open every task the way Pages serves it
        run: uv run --frozen --group previews python scripts/check_site.py dist/_site --base-path "/${{ github.event.repository.name }}/" --chrome

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/_site

  deploy:
    needs: site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The required check. A job skipped behind a failed `needs` would read as passed.
  ready:
    needs: [plan, build, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.plan.result }}" = success
          if [ "${{ needs.plan.outputs.build }}" != true ]; then
            echo "Nothing the site reads changed."
            exit 0
          fi
          test "${{ needs.build.result }}" = success
          test "${{ needs.site.result }}" = success
