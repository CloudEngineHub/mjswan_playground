name: publish

# Puts the package on PyPI, so `uvx mjswan-playground run <task-id>` needs no clone.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing: no API token to store.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - run: uv build

      - run: uv publish
